[package]
name = "hyper-fit-pack"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false
repository = "https://github.com/HypeR-Proj/fit-pack"

[dependencies]

[dependencies.hyper-vm-image]
version = "=0.0.0"
path = "../../lib/vm-image"

[lints]

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[patch]

[patch.crates-io]

[patch.crates-io.hyper-abi]
path = "../../sdk/abi"

[patch.crates-io.hyper-os]
path = "../../stdlib/rust/hyper-os"
